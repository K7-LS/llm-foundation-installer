name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-test:
    name: Python 3.12 / ${{ matrix.shell }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        shell: ${{ matrix.shell }}
        run: python -m pip install --disable-pip-version-check pytest
      - name: Show runtime versions
        shell: ${{ matrix.shell }}
        run: |
          python --version
          $PSVersionTable.PSVersion.ToString()
      - name: Run offline suite
        shell: ${{ matrix.shell }}
        env:
          LLM_FOUNDATION_CI_OFFLINE: "1"
        run: python -m pytest -q
      - name: Verify tests did not mutate tracked files
        shell: ${{ matrix.shell }}
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            $dirty
            throw "Offline tests modified the worktree"
          }
