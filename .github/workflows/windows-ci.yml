name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_public_unsigned:
        description: Build Owner and Employee PublicUnsigned bundles
        required: true
        type: boolean
        default: false
      build_input_tag:
        description: Draft release tag containing k7-build-input-0.4.0-r1.zip
        required: false
        type: string
        default: k7-v0.4.0-r1-build-input

permissions:
  contents: read

concurrency:
  group: foundation-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-test-ps7:
    name: Python 3.12 / PowerShell 7
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest
      - name: Show runtime versions
        shell: pwsh
        run: |
          python --version
          $PSVersionTable.PSVersion.ToString()
      - name: Run offline suite
        shell: pwsh
        env:
          LLM_FOUNDATION_CI_OFFLINE: "1"
        run: python -m pytest -q
      - name: Verify tests did not mutate tracked files
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            $dirty
            throw "Offline tests modified the worktree"
          }

  offline-test-ps51:
    name: Python 3.12 / Windows PowerShell 5.1
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        shell: powershell
        run: python -m pip install --disable-pip-version-check pytest
      - name: Show runtime versions
        shell: powershell
        run: |
          python --version
          $PSVersionTable.PSVersion.ToString()
      - name: Run offline suite
        shell: powershell
        env:
          LLM_FOUNDATION_CI_OFFLINE: "1"
        run: python -m pytest -q
      - name: Verify tests did not mutate tracked files
        shell: powershell
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            $dirty
            throw "Offline tests modified the worktree"
          }

  build-public-unsigned:
    name: PublicUnsigned Owner and Employee
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.build_public_unsigned
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable build inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_INPUT_TAG: ${{ inputs.build_input_tag }}
        run: |
          gh release download $env:BUILD_INPUT_TAG `
            --pattern k7-build-input-0.4.0-r1.zip `
            --dir .work/input-download
          Expand-Archive `
            -LiteralPath .work/input-download/k7-build-input-0.4.0-r1.zip `
            -DestinationPath .work/build-input
      - name: Build release editions with Roslyn
        shell: pwsh
        run: |
          $common = @{
            DistributionMode = 'PublicUnsigned'
            PackageRoot = '.work/build-input/packages'
            FoundationPackageRoot = '.work/build-input/foundation'
            ProviderEligibilityEvidence = (
              '.work/build-input/evidence/provider-eligibility-evidence.json'
            )
            ClientSourcesLock = 'client-sources.lock.json'
            RuntimeSourcesLock = 'runtime-sources.lock.json'
            RuntimeArchive = (
              '.work/build-input/runtime/' +
              'sing-box-1.13.14-windows-amd64.zip'
            )
          }
          ./tools/build-edition.ps1 `
            -OutputRoot .work/release/employee `
            -Edition Employee @common
          ./tools/build-edition.ps1 `
            -OutputRoot .work/release/owner `
            -Edition Owner @common
      - name: Verify standalone products and manifests
        shell: pwsh
        run: |
          $roots = @(
            '.work/release/employee',
            '.work/release/owner'
          )
          foreach ($root in $roots) {
            $manifest = Get-Content `
              -LiteralPath "$root/bundle-manifest.json" -Raw |
                ConvertFrom-Json
            if ($manifest.distribution_mode -cne 'PublicUnsigned' -or
                $manifest.verdicts.PUBLIC_UNSIGNED_RELEASE -cne 'PASS' -or
                $manifest.verdicts.PROGRAM_RELEASE -cne '3/3') {
              throw "Release manifest is not PublicUnsigned-ready: $root"
            }
            foreach ($product in @(
              $manifest.products.installer.file,
              $manifest.products.launch_center.file
            )) {
              $exe = Join-Path $root $product
              $selfTest = & $exe --self-test-json | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or $selfTest.status -cne 'PASS') {
                throw "Self-test failed: $product"
              }
              $catalog = & $exe --catalog-json | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or
                  $catalog.provider_eligibility -cne 'PASS' -or
                  @($catalog.targets | Where-Object {
                    $_.package_state -cne 'accepted'
                  }).Count -ne 0) {
                throw "Catalog verification failed: $product"
              }
            }
          }
      - name: Package immutable release candidates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .work/artifacts | Out-Null
          foreach ($edition in @('employee', 'owner')) {
            $root = ".work/release/$edition"
            $hashes = Get-ChildItem -LiteralPath $root -File |
              Sort-Object Name |
              ForEach-Object {
                $hash = (Get-FileHash -LiteralPath $_.FullName `
                  -Algorithm SHA256).Hash.ToLowerInvariant()
                "$hash  $($_.Name)"
              }
            [IO.File]::WriteAllLines(
              (Join-Path $root 'SHA256SUMS.txt'),
              $hashes,
              (New-Object Text.UTF8Encoding($false))
            )
            Compress-Archive -Path "$root/*" `
              -DestinationPath (
                ".work/artifacts/k7-installer-$edition-" +
                "0.4.0-r1-publicunsigned.zip"
              )
          }
      - uses: actions/upload-artifact@v4
        with:
          name: k7-installer-0.4.0-r1-publicunsigned
          path: .work/artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
